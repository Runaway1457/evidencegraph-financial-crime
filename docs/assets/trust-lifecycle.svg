<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">EvidenceGraph trust lifecycle</title><desc id="desc">A six-stage flow from immutable evidence to confirmed findings, with controls and rejected paths.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111c"/><stop offset="1" stop-color="#0d1b28"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#4acff2"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.t{fill:#eef7ff;font-weight:700}.m{fill:#8da3b6}.edge{stroke:#4acff2;stroke-width:4;fill:none;marker-end:url(#arr)}.reject{stroke:#ff667a;stroke-width:3;fill:none;stroke-dasharray:8 8;marker-end:url(#arr)}</style></defs>
  <rect width="1600" height="780" rx="28" fill="url(#bg)"/><text x="70" y="76" class="t" font-size="38">The trust lifecycle</text><text x="70" y="111" class="m" font-size="18">Each transition narrows what the system is allowed to claim.</text>
  <g transform="translate(72 188)">
    <g><rect width="210" height="170" rx="18" fill="#0d2332" stroke="#42d8ff"/><text x="24" y="38" fill="#42d8ff" font-size="14" font-weight="700">01 · INGEST</text><text x="24" y="78" class="t" font-size="22">Evidence</text><text x="24" y="108" class="m" font-size="15">SHA-256 digest</text><text x="24" y="133" class="m" font-size="15">source metadata</text></g>
    <g transform="translate(250)"><rect width="210" height="170" rx="18" fill="#151e34" stroke="#a88bfa"/><text x="24" y="38" fill="#a88bfa" font-size="14" font-weight="700">02 · LINK</text><text x="24" y="78" class="t" font-size="22">Graph path</text><text x="24" y="108" class="m" font-size="15">case-local edges</text><text x="24" y="133" class="m" font-size="15">cited relationships</text></g>
    <g transform="translate(500)"><rect width="210" height="170" rx="18" fill="#2a2117" stroke="#ffb44c"/><text x="24" y="38" fill="#ffb44c" font-size="14" font-weight="700">03 · PROPOSE</text><text x="24" y="78" class="t" font-size="22">Hypothesis</text><text x="24" y="108" class="m" font-size="15">structured output</text><text x="24" y="133" class="m" font-size="15">still unverified</text></g>
    <g transform="translate(750)"><rect width="210" height="170" rx="18" fill="#102c29" stroke="#36e6af"/><text x="24" y="38" fill="#36e6af" font-size="14" font-weight="700">04 · ENFORCE</text><text x="24" y="78" class="t" font-size="22">Policy + gate</text><text x="24" y="108" class="m" font-size="15">authorization</text><text x="24" y="133" class="m" font-size="15">citation validation</text></g>
    <g transform="translate(1000)"><rect width="210" height="170" rx="18" fill="#291923" stroke="#ff667a"/><text x="24" y="38" fill="#ff667a" font-size="14" font-weight="700">05 · CHALLENGE</text><text x="24" y="78" class="t" font-size="22">Human review</text><text x="24" y="108" class="m" font-size="15">independent actor</text><text x="24" y="133" class="m" font-size="15">accept or reject</text></g>
    <g transform="translate(1250)"><rect width="210" height="170" rx="18" fill="#122734" stroke="#d9e7f2"/><text x="24" y="38" fill="#d9e7f2" font-size="14" font-weight="700">06 · RECORD</text><text x="24" y="78" class="t" font-size="22">Finding</text><text x="24" y="108" class="m" font-size="15">confirmed state</text><text x="24" y="133" class="m" font-size="15">full provenance</text></g>
    <path d="M210 85H238M460 85H488M710 85H738M960 85H988M1210 85H1238" class="edge"/>
  </g>
  <g transform="translate(72 410)">
    <rect width="1460" height="116" rx="18" fill="#0b1924" stroke="#29465b"/><text x="30" y="34" fill="#42d8ff" font-size="14" font-weight="700">FAIL-CLOSED CONTROLS</text>
    <g class="m" font-size="16"><text x="30" y="74">Unknown evidence ID</text><text x="310" y="74">Cross-case citation</text><text x="586" y="74">Duplicate citation</text><text x="846" y="74">Invalid confidence</text><text x="1110" y="74">Self-approval</text></g>
    <g fill="#ff667a"><circle cx="224" cy="69" r="5"/><circle cx="502" cy="69" r="5"/><circle cx="772" cy="69" r="5"/><circle cx="1034" cy="69" r="5"/><circle cx="1250" cy="69" r="5"/></g>
  </g>
  <path d="M860 358V398" class="reject"/><text x="884" y="390" fill="#ff667a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">rejected before persistence</text>
  <g transform="translate(72 574)"><rect width="1460" height="126" rx="18" fill="#0f2829" stroke="#36e6af"/><text x="30" y="41" fill="#36e6af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">ACCOUNTABILITY CONTRACT</text><text x="30" y="82" class="t" font-size="22">AI may accelerate investigation. It may not erase provenance, bypass policy or confirm its own work.</text></g>
</svg>
