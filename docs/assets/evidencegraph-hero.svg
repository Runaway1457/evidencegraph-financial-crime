    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#42d8ff"/><stop offset="1" stop-color="#36e6af"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#ffcc66"/><stop offset="1" stop-color="#ff8a4c"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#42d8ff" stop-opacity=".25"/><stop offset="1" stop-color="#42d8ff" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#173149" stroke-width="1" opacity=".45"/></pattern>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="28" fill="url(#grid)"/>
  <circle cx="1250" cy="345" r="430" fill="url(#halo)"/>
  <rect x="58" y="48" width="1484" height="624" rx="22" fill="none" stroke="#23435b"/>
