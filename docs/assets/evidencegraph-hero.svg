      <g transform="translate(260)"><rect width="206" height="66" rx="12" fill="#0d2130" stroke="#22526b"/><text x="20" y="28" fill="#36e6af" font-size="13" font-weight="700" letter-spacing="1.5">GROUNDING</text><text x="20" y="51" fill="#eaf6ff" font-size="18" font-weight="700">10 / 10 evals</text></g>
      <g transform="translate(482)"><rect width="224" height="66" rx="12" fill="#0d2130" stroke="#22526b"/><text x="20" y="28" fill="#ffb44c" font-size="13" font-weight="700" letter-spacing="1.5">GOVERNANCE</text><text x="20" y="51" fill="#eaf6ff" font-size="18" font-weight="700">Four-eyes review</text></g>
