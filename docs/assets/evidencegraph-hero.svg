<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">EvidenceGraph Financial Crime</title>
  <desc id="desc">Evidence-first AI investigation platform with graph reasoning, governed agents and human accountability.</desc>
  <defs>
