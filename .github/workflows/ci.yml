name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EG_DATABASE_URL: sqlite+pysqlite:///./migration-smoke.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check backend && uv run ruff format --check backend
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov-report=xml
      - name: Grounding evals
        run: >-
          uv run python scripts/run_grounding_evals.py
          --dataset evals/grounding_cases.jsonl
          --report eval-results.json
      - name: Migration smoke and drift check
        run: uv run alembic upgrade head && uv run alembic check
      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality
          path: |
            coverage.xml
            eval-results.json

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      - name: Capture verified UI
        run: |
          mkdir -p ../docs/assets
          VITE_DEMO_MODE=true npm run build -- --outDir demo-dist
          python3 -m http.server 4173 --directory demo-dist > /tmp/evidencegraph-ui.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173 > /dev/null && break
            sleep 0.5
          done
          google-chrome --headless --no-sandbox --hide-scrollbars \
            --window-size=1920,1080 \
            --screenshot=../docs/assets/investigation-workbench.png \
            http://127.0.0.1:4173
          test -s ../docs/assets/investigation-workbench.png
      - name: Upload verified UI
        uses: actions/upload-artifact@v4
        with:
          name: verified-ui
          path: docs/assets/investigation-workbench.png
          if-no-files-found: error

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Test authorization policies
        run: >-
          opa test
          policies/bundle/evidencegraph.rego
          policies/bundle/data.json
          policies/evidencegraph_test.rego
          --format=pretty


  stack-smoke:
    needs: [backend, frontend, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose model
        run: docker compose -f deployment/compose.yaml config --quiet
      - name: Build and start the stack
        run: |
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose -f deployment/compose.yaml ps || true
              docker compose -f deployment/compose.yaml logs || true
            fi
            docker compose -f deployment/compose.yaml down --volumes || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose -f deployment/compose.yaml up --detach --build web worker
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f deployment/compose.yaml ps
              docker compose -f deployment/compose.yaml logs
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/ | grep --quiet "EvidenceGraph"
          curl --fail --silent --request POST \
            --header "X-Actor-ID: analyst_1" \
            http://127.0.0.1:8080/api/v1/cases/case_1/investigations \
            > /tmp/investigation.json
          run_id="$(python3 -c 'import json; print(json.load(open("/tmp/investigation.json"))["id"])')"
          test -n "$run_id"
          for attempt in {1..30}; do
            run_status="$(curl --fail --silent "http://127.0.0.1:8080/api/v1/investigation-runs/$run_id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            [ "$run_status" = "completed" ] && break
            [ "$run_status" = "failed" ] && exit 1
            sleep 1
          done
          [ "$run_status" = "completed" ]
          finding_id="$(curl --fail --silent http://127.0.0.1:8080/api/v1/cases/case_1/findings | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])')"
          curl --fail --silent --request POST \
            --header "Content-Type: application/json" \
            --header "X-Actor-ID: reviewer_2" \
            --data '{"decision":"confirmed"}' \
            "http://127.0.0.1:8080/api/v1/cases/case_1/findings/$finding_id/review" \
            | grep --quiet '"status":"confirmed"'
          curl --fail --silent http://127.0.0.1:8080/api/v1/cases/case_1/findings \
            | grep --quiet '"reviewed_by":"reviewer_2"'
          docker compose -f deployment/compose.yaml ps
