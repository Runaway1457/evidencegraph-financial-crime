name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EG_DATABASE_URL: sqlite+pysqlite:///./migration-smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend && ruff format --check backend
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov-report=xml
      - name: Migration smoke and drift check
        run: alembic upgrade head && alembic check
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Capture verified UI
        run: |
          mkdir -p ../docs/assets
          python3 -m http.server 4173 --directory dist > /tmp/evidencegraph-ui.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173 > /dev/null && break
            sleep 0.5
          done
          google-chrome --headless --no-sandbox --hide-scrollbars \
            --window-size=1920,1080 \
            --screenshot=../docs/assets/investigation-workbench.png \
            http://127.0.0.1:4173
          test -s ../docs/assets/investigation-workbench.png
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      - name: Upload verified UI
        uses: actions/upload-artifact@v4
        with:
          name: verified-ui
          path: docs/assets/investigation-workbench.png
          if-no-files-found: error

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Test authorization policies
        run: opa test policies --format=pretty
