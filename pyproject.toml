[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidencegraph-financial-crime"
version = "0.3.0"
description = "Evidence-first financial-crime investigation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Gabriel Borges" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.43,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/Runaway1457/evidencegraph-financial-crime"
Documentation = "https://github.com/Runaway1457/evidencegraph-financial-crime/tree/main/docs"
Engineering-Hub = "https://gabriel-engineering-hub.nagatoimoveis.chatgpt.site"

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/evidencegraph"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=evidencegraph --cov-branch --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
packages = ["evidencegraph"]
plugins = ["sqlalchemy.ext.mypy.plugin"]
